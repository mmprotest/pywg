[tool.poetry]
name = "pywg"
version = "0.1.0"
description = "Python to WebGPU kernels compiler with CPU fallback"
authors = ["PyWG Team <team@pywg.dev>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "pywg", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.23"
typing-extensions = "^4.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
mypy = "^1.8"
ruff = "^0.1.11"
black = "^23.12"
build = "^1.0"
twine = "^4.0"
pre-commit = "^3.5"

[tool.poetry.scripts]
pywg-demo = "pywg.demo:main"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "B", "UP", "N", "S", "TID", "T20"]
ignore = ["E203", "E266", "E501", "E731", "B905", "B907"]
exclude = ["demo/webgpu_runtime.js"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pywg"]
